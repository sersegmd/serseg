name: Experimental compiler checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serseg
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Linux subset
        run: make test
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: serseg
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            file
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Verify native Windows Python
        run: python3 -c 'import os; assert os.name == "nt", os.name'
      - name: Build and test Windows subset (not yet validated)
        run: make test
